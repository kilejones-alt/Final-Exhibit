name: Homepage artistic interaction preview
on:
  push:
    branches: [homepage-artistic-interactions-review]
    paths:
      - '.github/workflows/homepage-artistic-preview.yml'
      - 'tools/homepage-artistic-preview.mjs'
      - 'index.html'
      - 'homepage.css'
      - 'installation/installation.js'
      - 'installation/installation.css'
      - 'installation/cinema-original.css'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: node tools/homepage-artistic-preview.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: homepage-artistic-interactions-preview
          path: qa/homepage-artistic-preview/
          retention-days: 7
