name: Exhibition page hard rules
on:
  pull_request:
  push:
    branches:
      - main
      - page-two-type-motion-languages-review
jobs:
  check-exhibit-pages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate all 20 multilingual page shells
        run: node tools/validate-exhibit-pages.mjs
