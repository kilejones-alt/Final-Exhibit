name: Review motion capture
on:
  push:
    branches: [page-two-type-motion-languages-review]
    paths:
      - '.github/workflows/review-motion.yml'
      - 'tools/review-motion.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: node tools/review-motion.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: current-review-motion
          path: qa/review-motion/
          retention-days: 7
