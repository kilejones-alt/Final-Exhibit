name: Homepage motion capture
on:
  push:
    branches: [page-two-type-motion-languages-review]
    paths:
      - '.github/workflows/homepage-motion.yml'
      - 'tools/homepage-motion.mjs'
      - 'homepage.css'
      - 'index.html'
      - 'installation/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: node tools/homepage-motion.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: homepage-motion-only
          path: qa/homepage-motion/
          retention-days: 7
