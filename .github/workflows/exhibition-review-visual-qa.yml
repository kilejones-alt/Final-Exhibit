name: Exhibition review visual QA
on:
  pull_request:
    paths:
      - 'entrance.html'
      - 'he/entrance.html'
      - 'ru/entrance.html'
      - 'editorial-reading-review.css'
      - 'tools/second-page-browser-qa.mjs'
      - '.github/workflows/exhibition-review-visual-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  capture-review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: mkdir -p qa/generated && node tools/second-page-browser-qa.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exhibition-reading-review-viewport-qa
          path: qa/generated/
          retention-days: 7
