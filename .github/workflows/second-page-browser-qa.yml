name: Second page browser QA
on:
  workflow_dispatch:
  push:
    branches: [page-two-type-motion-languages-review]
    paths: ['.github/workflows/second-page-browser-qa.yml','tools/second-page-browser-qa.mjs']
permissions:
  contents: write
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: mkdir -p qa/generated && node tools/second-page-browser-qa.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: second-page-viewport-screenshots
          path: qa/generated/
      - name: Save QA report and screenshots in review branch
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add qa/generated
          git commit -m "QA: captured real viewport screenshots [skip ci]" || exit 0
          git push
