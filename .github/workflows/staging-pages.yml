name: Publish review-only exhibition preview
on:
  workflow_dispatch:
  push:
    branches: [page-two-type-motion-languages-review]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: review-pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - uses: actions/deploy-pages@v4
