name: Trilingual gallery and cinematic motion QA
# Retired gallery-master implementation; retained for manual historical QA.
# The active gallery uses .github/workflows/gallery-all-locales-qa.yml.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gallery-mobile-desktop:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium webkit
      - run: node tools/gallery-master-qa.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trilingual-gallery-safari-and-chromium
          path: |
            qa/generated/gallery-master-report.json
            qa/generated/gallery-*.png
          retention-days: 7
