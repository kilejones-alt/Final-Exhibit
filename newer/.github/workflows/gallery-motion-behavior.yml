name: Exhibition slow motion visual behavior
on:
  push:
    branches: [main]
    paths:
      - 'museum-global.css'
      - 'museum-global.js'
      - 'exhibit.css'
      - 'exhibit.js'
      - 'tools/gallery-motion-behavior-qa.mjs'
      - '.github/workflows/gallery-motion-behavior.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  slow-gallery-motion:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium webkit
      - run: node tools/gallery-motion-behavior-qa.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gallery-actual-motion-safari-chromium
          path: |
            qa/generated/gallery-motion-behavior.json
            qa/generated/falling-text-*.png
            qa/generated/camera-zoom-*.png
          retention-days: 7
