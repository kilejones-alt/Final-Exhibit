el.”","chapter":"UNIVERSALIZED & CODIFIED","duration":10,"kind":"macro","accent":"07","art":"assets/deicide-cinema/artwork_07.webp","card":"assets/deicide-cinema/deicide_carousel_07.webp"},{"year":"c. 165 CE","eyebrow":"MELITO OF SARDIS","title":"“God has been murdered.”","body":"The accusation enters Christian polemic.","chapter":"UNIVERSALIZED & CODIFIED","duration":10,"kind":"pan","accent":"08","art":"assets/deicide-cinema/artwork_08.webp","card":"assets/deicide-cinema/deicide_carousel_08.webp"},{"year":"c. 240 CE","eyebrow":"ORIGEN","title":"Displacement interpreted","body":"As divine punishment.","chapter":"UNIVERSALIZED & CODIFIED","duration":8,"kind":"still","accent":"09","art":"assets/deicide-cinema/artwork_09.webp","card":"assets/deicide-cinema/deicide_carousel_09.webp"},{"year":"325 CE","eyebrow":"CONSTANTINE · NICAEA","title":"The voice of an emperor","body":"The ancient libel spoke with the voice of an emperor.","chapter":"UNIVERSALIZED & CODIFIED","duration":9,"kind":"slow","accent":"10","art":"assets/deicide-cinema/artwork_10.webp","card":"assets/deicide-cinema/deicide_carousel_10.webp"},{"year":"380 CE","eyebrow":"THEODOSIUS I","title":"Imperial orthodoxy","body":"Nicene Christianity became the authorized orthodoxy of the Roman Empire.","chapter":"UNIVERSALIZED & CODIFIED","duration":9,"kind":"orbit","accent":"11","art":"assets/deicide-cinema/artwork_11.webp","card":"assets/deicide-cinema/deicide_carousel_11.webp"},{"year":"c. 387 CE","eyebrow":"JOHN CHRYSOSTOM","title":"“The slayers of Christ.”","body":"","chapter":"UNIVERSALIZED & CODIFIED","duration":9,"kind":"close","accent":"12","art":"assets/deicide-cinema/artwork_12.webp","card":"assets/deicide-cinema/deicide_carousel_12.webp"},{"year":"440 CE","eyebrow":"FROM DISPUTE TO DOCTRINE","title":"The libel, complete","body":"From local theological dispute, to collective accusation, to imperial doctrine and social policy.","chapter":"THE LIBEL, COMPLETE","duration":10,"kind":"slow","accent":"13","art":"assets/deicide-cinema/artwork_13.webp","card":"assets/deicide-cinema/deicide_carousel_13.webp"},{"year":"THE HISTORICAL RECORD","eyebrow":"ACKNOWLEDGMENTS","title":"The Deicide Libel","body":"Natasha H. Pein  ·  Kile Jones","chapter":"CREDITS","duration":7,"kind":"still","accent":"14","art":"assets/deicide-cinema/artwork_14.webp","card":"assets/deicide-cinema/deicide_carousel_14.webp"}];
